services:
  configSrv.1:
    image: mongo:latest # docker образ
    container_name: configSrv.1
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - config-data.1:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27017"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  configSrv.2:
    image: mongo:latest # docker образ
