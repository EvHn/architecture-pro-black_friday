services:
  redis_1:
    image: "redis:latest"
    container_name: redis_1
    ports:
      - "6379"
    networks:
      app-network:
        ipv4_address: 173.17.0.2
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]

  configSrv.1:
    image: mongo:latest
    container_name: configSrv.1
    restart: always
    ports:
      - "27017:27017"
    networks:
      app-network:
        ipv4_address: 173.17.0.8
    volumes:
      - config-data.1:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27017"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  configSrv.2:
    image: mongo:latest
    container_name: configSrv.2
    restart: always
    ports:
