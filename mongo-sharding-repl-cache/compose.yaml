  mongos_router:
    image: mongo:latest
    container_name: mongos_router
    restart: always
    ports:
      - "27026:27026"
    networks:
      app-network:
        ipv4_address: 173.17.0.17
    command:
      [
        "mongos",
        "--configdb",
        "config_server/configSrv.1:27017,configSrv.2:27018,configSrv.3:27019",
        "--bind_ip_all",
        "--port",
        "27026"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router
    ports:
      - 8080:8080
    networks:
      app-network:
        ipv4_address: 173.17.0.18
    environment:
      MONGODB_URL: "mongodb://173.17.0.17:27026"
      MONGODB_DATABASE_NAME: "somedb"
      REDIS_URL: "redis://173.17.0.2:6379"

volumes:
  config-data.1:
  config-data.2:
  config-data.3:
  shard1.1-data:
  shard1.2-data:
  shard1.3-data:
  shard2.1-data:
  shard2.2-data:
  shard2.3-data:
  redis_1_data: { }

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 173.17.0.0/25